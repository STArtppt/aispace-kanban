schema: spec-driven

# 写 OpenSpec 产物(proposal / specs / design / tasks)时注入给 AI 的项目上下文。
# 事实源是根目录 AGENTS.md —— 这里只放"写规划产物当下必须知道"的部分,不复制它的内容,
# 避免两份文档漂移。改协作约定去改 AGENTS.md。
context: |
  项目:aispace-kanban —— 与 AI 反复对话完成知识工作时用的本机**只读看板**。
  完整规范先读根目录 AGENTS.md(唯一事实源);具体怎么改代码读
  .claude/skills/dashboard-feature-flow(加/改功能的主入口)。

  ## 写规划产物时的硬约束

  - **中文书写**。proposal / specs / design / tasks 一律中文,平实、说清后果,
    不写"操作失败请重试"这类空话,语气与 README 一致。
  - **三个平面**:CLI(`bin/cli.mjs`)/ 服务端(`src/server/**`,`.mjs`,**无类型检查**)/
    前端(`src/app/**`,TS strict)。影响面必须写清落在哪几个平面。
    跨平面的唯一契约是 `src/app/lib/api.ts`,改一侧就要改另一侧。
  - **只读红线**:看板对工作空间只读,一切工作空间内路径必须过 `resolveInside()`。
    任何"往工作空间写"的方案,在 proposal 里显式标出来留给人拍板,不要在 tasks 里顺手做掉。
  - **常驻服务不热更**:改 `src/server/**` 或 `bin/cli.mjs` 必须重启进程才生效;
    新增接口字段一律可选 + 前端兜底(用户可能跑着旧进程配新前端)。
  - **验收闸门**:`pnpm typecheck`(只覆盖 `src/app`)+ `pnpm build` + 重启后浏览器点一遍。
    服务端没有静态检查也没有测试,typecheck 绿不等于做完。
  - **templates/ 是另一套语境**(发给用户的工作空间模板),本仓编码规范不适用于它内部;
    改动涉及它要单独说明,并记住"放进去就是发出去"。

  ## 公开仓库脱敏红线(写任何产物前先过一遍)

  本仓已开源在 GitHub,`openspec/` 下的一切都会随代码公开发布,**且进 git 历史后删不干净**。
  所以规划产物里只能出现"公开仓库读者也该看到"的信息:

  - **不写真实客户 / 甲方 / 未公开业务方的名称**,包括出现在文件名里的。
    需要举证就化名或只描述特征 —— 写"某份 14 张图的 PRD"、"一份 WPS 导出的技术规范",
    不写它的真实标题。
  - **不写本机绝对路径**(`/Users/<用户名>/...`)。用仓库相对路径,或写 `<工作空间根>/input/raw/`。
  - **不写内网地址、内部 Git 远端、服务器 IP、端口映射**。要提远端就只提公开的 GitHub 仓库。
  - **不写任何凭据**:token、API key、密码、邮箱、账号。一个都不要,包括"示例用"的假值旁边
    跟着真值的情况。
    **例外**:项目公开反馈邮箱 `aispace_kanban@163.com` 可以写进源码和产物,它是对外的反馈地址。
    其它邮箱照旧不写。
  - **不粘贴真实资料的正文片段与截图**。需要样例就自己造一份合成件。
  - 拿不准就**不写**,或者把细节留在会话里、产物里只写结论。

  这条对 `design.md` 的"Context / 现状"一节尤其容易破防 —— 调研阶段的实测数据经常带着
  真实文件名和本机路径,搬进产物前先替换掉。

# 各产物的额外要求(叠加在 schema 自带指令之上)
rules:
  proposal:
    - 开头一句话说清"不做会怎样",不要从方案讲起。
    - Impact 必须点名落在哪几个平面(CLI / 服务端 / 前端 / templates),以及是否动 src/app/lib/api.ts 契约。
    - 涉及往工作空间写入、或要放宽只读红线的,必须在 proposal 里单独成段标出来,留给人拍板。
    - 引入新依赖要写清给哪个平面用;服务端用的必须进 dependencies(bin/ 拿不到 devDependencies)。
  specs:
    - 能力名用 kebab-case,贴着看板的语汇取(如 input-ingest、prototype-preview),别用泛词。
    - 场景的 WHEN/THEN 尽量落到可验证的动作上:能 curl 的接口、能点的按钮、能看到的空态。
    - 降级路径要单独写成场景 —— 工作空间目录丢失、project.yaml 缺失、旧服务进程少给字段。
  design:
    - 只在跨平面、引新依赖、动数据形状或有降级/兼容复杂度时才写;琐碎改动不要凑这一篇。
    - Decisions 每条都要写备选方案和"为什么不选它",这是这篇文档存在的理由。
    - 现状与实测数据搬进来之前,先按上面的脱敏红线替换真实文件名和本机路径。
  tasks:
    - 按平面和依赖顺序分组:服务端产出数据 → 同步 api.ts 契约 → 前端接入 → 自动刷新范围。
    - 改了 src/server/** 或 bin/cli.mjs 的任务,验证步骤里要写明"重启 pnpm dev / serve"。
    - 最后一组固定是验收闸:pnpm typecheck、pnpm build、重启后浏览器把受影响视图点一遍
      (含无 project.yaml、目录丢失、深色模式三种情况)。

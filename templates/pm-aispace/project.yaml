# 项目元信息 —— 整个工作空间的身份证。
#
# 规则（重要）：
#   null        = 这个字段该有，但资料里还没有答案 → 看板会把它列进「待补充」
#   provenance  = 字段来自哪份资料的哪一节，点号路径旁挂，别删
#   confidence  = 只列非「资料写明」的字段：推断 / 口述待确认
#   没有把握的不要填。填错比留空危险 —— 留空是缺口，填错是假事实。
#
# 由 pm-project-meta 技能维护：新资料进来时增量补全，不覆盖人工确认过的字段。
#
# 新建的工作空间里这份文件几乎全是 null，这是设计如此 ——
# 合同、招标技术文件、立项报告这些定义项目的资料，多数时候是后补进来的。
# 等它们进了 input/converted/，让 AI 用 pm-project-meta 提取，增量补全。

schema: pmwork-project-meta/v1

workspace:
  name: null # 由 scripts/init_workspace.py 写入
  created_at: null # 同上
  stage: null # 如：售前 / 方案设计 / 开发 / 验收
  owner: null

identity:
  项目名称: null
  项目别名: null
  甲方: null
  承建方: null
  项目类型: null
  合同编号: null
  建设周期:
    开始: null
    结束: null
  质保期: null
  覆盖范围: null
  合同金额: null

background:
  痛点: [] # 项目要解决的具体问题，一条一句话，带来源
  目标: [] # 建设目标
  量化指标: [] # 形如 { 指标: 名称, 要求: 数值或口径 }；没有数字的目标不要放这里

scope:
  建设内容: [] # 形如 { 模块: 名称, 核心能力: 描述 }
  明确不做: [] # 资料里写明「本期不含」的事项。空列表 ≠ 无边界，多半是还没问

stakeholders: [] # 形如 { 姓名: , 单位: , 角色: , 职责: }

milestones: [] # 形如 { 名称: , 时间: , 交付物: , 验收方式: }

deliverables: [] # 形如 { 名称: , 类型: , 阶段: }：成果交付要求，报告、文档、专利、软著等

constraints:
  技术要求: {} # 平台依赖、数据源、集成方式、架构原则等
  性能指标: {} # 响应时间、并发量、可用性 —— 评审会上最常被追问的一块
  合规: [] # 等保定级、行业安全规定、个人信息保护、涉密要求等
  团队与服务: {} # 人员配置、驻场要求、培训与运维服务

systems: [] # 形如 { 名称: , 归属: , 用途: }：要对接的既有系统

acceptance:
  流程: []
  标准: []

documents: [] # 形如 { path: input/converted/xxx.md, 角色: , 提取于: }：元信息提取自哪些资料

provenance: {} # 点号路径 → "文件 · 小节"。每个非 null 字段都要有一条

confidence: {} # 点号路径 → 推断 / 口述待确认。资料写明的不记

deliverables: [] # 资料未列出成果交付要求（三维模型交付格式、源数据归属、文档清单等一概未涉及）

constraints:
  技术要求:
    渲染引擎: 基于 WebGL 协议开发的自有 3D 引擎，在浏览器内流畅展示 3D 场景与模型
    场景分层加载: 区域中心 → 电站 → 分区 → 子阵 → 设备，逐级加载
    地理数据格式: DEM；DOM 采用 GeoTIFF；倾斜摄影产出 OSGB / OBJ / FBX / STL；矢量采用 SHP（至少含 .shp/.shx/.dbf，可选 .prj/.sbn/.sbx/.fbn/.fbx）
    地理数据存储: 统一使用基于关系数据库系统的空间数据引擎存储与管理，不再单独建属性表和索引表
    数据采集方式: 遥感卫星、无人机航拍
    模型分级: 建筑 / 发电设施 / 绿化 / 其他四类模型各分 LOD1、LOD2、LOD3 三个细节层次
    编码体系: KKS 电厂标识系统，参考《GB/T 50549-2010 电站标识系统编码标准》《QSPI 9720-2016 光伏发电站标识系统（KKS）编码规范》；模型编码规范资料指向「附录 D」，但本资料未附该附录
    业务数据来源: 生产运行智能管理系统的大数据资源（统计数据、人员数据、设备数据、实时数据）
    定位与导航: 获取人员 GPS 位置后经坐标系转换与空间分析在三维场景中同步，支持最优路径规划、站内交通导航、实际路径回放
    视频联动: 摄像头全局调控、定位巡视、智能感知、预置点管理、红外识别
    边缘能力: 联接智能终端的边缘计算与实时 AI 能力（AIoT）
  性能指标: {} # 全文未给出场景加载时间、渲染帧率、并发用户数、数据刷新周期等任何可验收的性能数字
  合规: [] # 未提及等保定级、电力监控系统安全防护，也未提及测绘成果与地理信息数据的涉密管理、人员位置数据的个人信息合规
  团队与服务: {} # 资料未涉及人员配置、实施组织、培训与运维服务

systems:
  - { 名称: 生产运行智能管理系统, 归属: 甲方现有系统, 用途: 运行可视化的统计 / 人员 / 设备 / 实时数据来源 }
  - { 名称: 视频安防系统（摄像头）, 归属: 甲方现有系统, 用途: 摄像头调控与联动、电子围栏越界监测、人员到位录像 }
  - { 名称: 移动端应用, 归属: 未说明, 用途: 采集人员 GPS 位置，承载站内导航 }
  - { 名称: 工单系统, 归属: 未说明, 用途: 告警发生后「一键派单」的接收方（资料只提动作，未点名系统） }
  - { 名称: 遥感 / 无人机数据采集, 归属: 未说明, 用途: DEM、DOM、倾斜摄影模型的原始数据来源 }
  - { 名称: 智能终端（边缘计算设备）, 归属: 未说明, 用途: 边缘计算与实时 AI 能力的载体 }


identity:
  项目名称: 新能源场站数字孪生集成平台
  项目别名: 数字孪生集成应用平台
  甲方: 某能源集团山西分公司 # 资料文首自标「假定」，非合同事实
  承建方: pl科技有限公司 # 同上
  项目类型: 科技项目技术服务 # 同上
  合同编号: null # 本资料是方案建议书，非合同
  建设周期:
    开始: 2023-01 # 资料自标「假定」，只给到月份，无阶段划分
    结束: 2023-12 # 同上
  质保期: null # 资料未涉及
  覆盖范围: 6 座地面式光伏电站（总装机 1.5GW）、4 座风电场（总装机 0.8GW）
  合同金额: 1998.8 万元 # 资料写「合同拟定金额」，且属自标「假定」的元信息

background:
  痛点:
    - 电站管理层级多、信息分散，运营管理层与运维作业层之间缺少高效联动手段
    - 标准化、精益化运维作业难以落地，作业质量依赖个人经验
    - 风光电站分布广、场区大，生产运营中的安全隐患难以及时洞察
    - 大基地电站规模大，传统管理方式做不到「大而易管、易管且安全」
    - 消缺过程不透明：告警发生后定位设备、派单、到达现场各环节割裂
  目标:
    - 以 1:1 镜像还原物理电站，实现对电站、分区、子阵、设备四级的精细化管理与在线动态巡视
    - 打造业务深度融合、数据贯通共享、运维流程清晰、消缺过程透明、安全生产易控的数字孪生集成应用平台
    - 实现「定向追踪虚实互通、智能感知云边共施、工单集成告警智能」
    - 具备应急处理机制沙盘推演、重大事件 3D 实景指挥调度能力
    - 联接智能终端的边缘计算与实时 AI 能力，创新新能源电站的安全生产运营管理模式
    - 拓宽数字孪生电站管理边界，提高 3D 数字可视化应用价值
  量化指标:
    # ⚠ 全部是三维建模精度，没有任何一条是系统性能指标（加载时间、帧率、并发、数据刷新周期）
    - { 指标: 建筑体块模型精度, 要求: 平面约 2m、高度约 3m，高层建筑可放宽至 5m }
    - { 指标: 建筑标准模型精度, 要求: 平面与高度约 1.5m }
    - { 指标: 建筑精细模型精度, 要求: 平面与高度约 1m }
    - { 指标: 发电设施体模型精度, 要求: 高度精度小于模型自身高度的 10% }
    - { 指标: 其他类基础模型精度, 要求: 高度精度小于模型自身高度的 20% }
    - { 指标: 绿化基础模型精度, 要求: 树木高度与实际误差在 5m 以内 }
    - { 指标: 可视化与导航的最小粒度, 要求: 组串级（实时数据查看、告警着色、路径导航均到组串） }

scope:
  建设内容:
    - { 模块: 基础地理模型, 核心能力: DEM、DOM、倾斜摄影模型、矢量地理数据集的采集与入库 }
    - { 模块: 三维实体模型, 核心能力: 建筑 / 发电设施 / 绿化 / 其他四类模型，按 LOD1-LOD3 三档细节层次建模 }
    - { 模块: 设备与模型关联, 核心能力: 基于 KKS 标识编码建立模型属性与设备业务数据的关联 }
    - { 模块: 三维可视化, 核心能力: 场景制作加载、场景效果动态变换（昼夜/天气）、站内设备精细展示、场景基本操作 }
    - { 模块: 运行可视化, 核心能力: 设备属性查看、人员属性查看、设备实时数据查看（最小单元组串） }
    - { 模块: 飞行视角巡视, 核心能力: 上帝视角 / 第一视角飞行浏览，定制飞行路线自动巡视 }
    - { 模块: 能量流向模拟, 核心能力: 集电线杆塔与场内输电线路 1:1 还原，模拟光伏区到升压站的能量流动 }
    - { 模块: 虚拟电子围栏, 核心能力: 安全边界渲染，结合 GPS 与摄像头做进出报警与智能录像 }
    - { 模块: 告警模型着色, 核心能力: 组串级故障告警的着色渲染，颜色可按告警级别与类型配置 }
    - { 模块: 高精度路径导航, 核心能力: 人员位置同步、最优路径规划、站内交通导航、实际路径回放、一键派单 }
    - { 模块: 视频安防集成, 核心能力: 摄像头全局调控、预置点管理、定位巡视、红外识别、人员到位自动录像 }
    - { 模块: 其他特色功能（资料标注「待完善」）, 核心能力: 基于知识图谱的告警 AI 治理、基于多模态深度学习的智能巡视、基于红外热斑的积灰/遮挡/阴影识别与组件清洗策略 }
  明确不做: [] # 资料未出现任何明确排除项。空列表 ≠ 无边界，这是立项评审前必须补齐的范围边界

